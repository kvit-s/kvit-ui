<?xml version="1.0" encoding="UTF-8"?>
<!-- The kvit-ui gallery's application icon. First-party artwork. Geometry
     only, with no text glyphs, so it draws the same without fonts at every
     size.

     The rounded dark square is what every Kvit application shares. The mark
     inside it is the gallery's own: three of the controls the gallery shows,
     a switch turned on, a ticked check box and a slider. It is neither the
     "K" of Kvit Notes, the three bars of Kvit Cash nor the two lines of Kvit
     Works, since they sit beside each other on a taskbar; at 16 px it still
     reads as a pill and a square above a line with a dot on it. The
     applications each take one colour; the gallery, which shows all the
     design values, takes three, the dark theme's Accent, Success and Warning
     tokens (kvit-ui/tokens), and the white Kvit Notes gives its upright bar.

     go run ./tools/appicon draws the gallery's PNGs and kvit-ui-gallery.ico
     from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a57"/>
      <stop offset="1" stop-color="#122638"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- the switch, on: its track and its knob at the right -->
  <rect x="108" y="124" width="168" height="104" rx="52" fill="#5c9fe0"/>
  <circle cx="224" cy="176" r="36" fill="#f4f7fa"/>
  <!-- the check box, ticked -->
  <rect x="300" y="124" width="104" height="104" rx="28" fill="#5abd82"/>
  <path d="M 326 178 L 345 197 L 380 158" fill="none" stroke="#122638"
        stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the slider: its track, the part up to the thumb, and the thumb -->
  <line x1="128" y1="340" x2="384" y2="340" stroke="#47627d"
        stroke-width="40" stroke-linecap="round"/>
  <line x1="128" y1="340" x2="236" y2="340" stroke="#e0a34c"
        stroke-width="40" stroke-linecap="round"/>
  <circle cx="236" cy="340" r="48" fill="#f4f7fa"/>
</svg>
